<!doctype html>
<html lang="ko">
<head>

<title>패밀리 라인 설치 · Family Line</title>
<!-- 설치 QR·공유용 주소: iPhone·iPad 는 App Store, Android 는 Google Play, 그 밖에는 소개 페이지로 보낸다 -->
<script>
(function () {
  var ua = navigator.userAgent || '';
  var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
  var android = /Android/i.test(ua);
  var to = ios
    ? 'https://apps.apple.com/app/id6837987661?ct=ejsoft.kr_qr'
    : android
      ? 'https://play.google.com/store/apps/details?id=kr.ejsoft.familyline&utm_source=ejsoft.kr&utm_medium=website&utm_campaign=familyline&utm_content=qr'
      : '/familyline';
  location.replace(to);
})();
</script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; margin: 0; padding: 48px 16px; text-align: center; color: #222; background: #fff; }
  @media (prefers-color-scheme: dark) { body { color: #eee; background: #121212; } a { color: #8ab4f8; } }
  a { display: block; margin: 14px auto; font-size: 18px; }
</style>
</head>
<body>
  <h1>패밀리 라인 · Family Line</h1>

  <a href="https://play.google.com/store/apps/details?id=kr.ejsoft.familyline&amp;utm_source=ejsoft.kr&amp;utm_medium=website&amp;utm_campaign=familyline&amp;utm_content=qr">Google Play (Android)</a>
  <a href="/familyline">소개 페이지 · About</a>
</body>
</html>
